<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GingerResources Dashboard</title>
    <link rel="icon" type="svg" href="https://pub-3a50bbfda00a49b2b959d58cd7bea019.r2.dev/Images/Logo/Icons/WhiteGinger.svg">

    <link rel="stylesheet" href="cssFiles/dashboard.css">
    <link rel="stylesheet" href="GlobalFiles/HEADER_FOOTER.css">
    <style>header{background: #112d4e; top: 0; bottom: 0;}</style>
</head>

<body>
    <header id="header" data-page="dashboard"></header>

    <main class="dashboardContainer">

        <div class="formCard">
            <h2>Add New Photo</h2>

            <!-- PHOTO URL -->
            <label>Photo URL</label>
            <input type="text" id="photoURL" placeholder="https://...">

            <!-- TITLE -->
            <label>Title</label>
            <input type="text" id="photoTitle" placeholder="Photo title">

            <!-- DESCRIPTION -->
            <label>Description</label>
            <textarea id="photoDesc" placeholder="Short description"></textarea>

            <!-- CATEGORY -->
            <label>Category</label>
            <select id="photoCategory">
                <option value="Travel">Travel</option>
                <option value="Food">Food</option>
                <option value="People">People</option>
                <option value="Nature">Nature</option>
                <option value="Animals">Animals</option>
                <option value="Objects">Objects</option>
                <option value="Daily Life">Daily Life</option>
                <option value="Events">Events</option>
            </select>

            <!-- TAGS -->
            <label>Tags (comma separated)</label>
            <input type="text" id="photoTags" placeholder="Night, City, Portrait">

            <!-- SUBMIT -->
            <button id="submitBtn">Add Photo</button>
            <p id="statusMsg"></p>
        </div>

        <!-- ADD BLOG POST -->
        <div class="formCard">
            <h2>Add New Blog Post</h2>

            <!-- BLOG TITLE -->
            <label>Post Title</label>
            <input type="text" id="postTitle" placeholder="Blog post title">

            <!-- BLOG DATE -->
            <label>Date</label>
            <input type="date" id="postDate">

            <!-- BLOG CATEGORY -->
            <label>Category</label>
            <select id="postCategory">
                <option value="Travel">Travel</option>
                <option value="Photography">Photography</option>
                <option value="China">China</option>
                <option value="New York">New York</option>
                <option value="Food">Food</option>
                <option value="Film">Film</option>
                <option value="Daily Life">Daily Life</option>
            </select>

            <!-- COVER IMAGE URL -->
            <label>Cover Image URL</label>
            <input type="text" id="postImage" placeholder="https://...">

            <!-- EXCERPT -->
            <label>Short Excerpt</label>
            <textarea id="postExcerpt" placeholder="Short preview text..."></textarea>

            <!-- FULL CONTENT -->
            <label>Full Content</label>
            <textarea id="postContent" placeholder="Full blog post content..." style="height: 150px;"></textarea>

            <!-- SUBMIT -->
            <button id="savePostBtn">Add Blog Post</button>
            <p id="statusMessage"></p>
        </div>
    </main>

    <footer id="footer"></footer>

<script type="module" src="jsFiles/dashboard.js"></script>
</body>
</html>
