<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>GingerJournal - Login</title>
    <link rel="icon" type="svg" href="https://pub-3a50bbfda00a49b2b959d58cd7bea019.r2.dev/Images/Logo/Icons/WhiteGinger.svg">
    <style>
        html, body {overscroll-behavior: none; border: 0; margin: 0; padding: 0; overflow: hidden;}
        video {width: 100%; height: 100vh; object-fit: cover;}
        .logo {width: 100%; height: calc(100vw/5); position: absolute; top: 0; left: 0; background-position: center; background-size: contain; background-repeat: no-repeat;}
        #googleLogin {
            top: calc(100vh/1.2);
            left: calc((100%/2) - 150px);
            position: absolute;
            width: 300px;
            padding: 18px 0;
            background: #112d4e;
            border-radius: 30px;
            border: none;
            font-size: 18px;
            color: white;
            font-weight: bold;
            transition: 0.3s;
        }
        #googleLogin:hover {cursor: pointer; scale: 0.98; border: 2px solid white;}
        .blur {background: black; position: absolute; top: 0; left: 0; width: 100%; height: 100vh; opacity: 0.3}
    </style>
</head>
<body>
        <video autoplay loop muted oncontextmenu="return false;" src="https://pub-3a50bbfda00a49b2b959d58cd7bea019.r2.dev/Videos/GingerHeader_%E5%89%AF%E6%9C%AC.MOV"></video>
        <div class="blur"></div>
        <div class="logo" style="background-image: url('https://pub-3a50bbfda00a49b2b959d58cd7bea019.r2.dev/Images/Logo/GingerLogo.png');"></div>

        <button id="googleLogin">Sign in with Google</button>
</body>
    <script type="module">
        import { auth, provider } from "./firebase-init.js";
        import { signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        document.getElementById("googleLogin").addEventListener("click", () => {
            signInWithPopup(auth, provider)
                .then((result) => {
                    alert("Logged in as: " + result.user.email);
                    window.location.href = "index.html"; // redirect after login
                })
                .catch((error) => alert(error.message));
        });
    </script>
</html>
