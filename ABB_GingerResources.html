<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>GingerResources</title>
    <link rel="stylesheet" href="cssFiles/GingerResources.css">
    <link rel="stylesheet" href="GlobalFiles/HEADER_FOOTER.css">
    <link rel="icon" type="svg" href="https://pub-3a50bbfda00a49b2b959d58cd7bea019.r2.dev/Images/Logo/Icons/WhiteGinger.svg">
</head>

<body>
<div id="header" data-page="gingerResources"></div>

<section class="photoGallery">
    <h1>Downloadable Photos</h1>
    <div id="photoContainer" class="photoContainer"></div>
</section>

</body>

<script type="module">
    console.log("SCRIPT VERSION 2 LOADED");

    /* -----------------------------
       IMPORTS
    ------------------------------*/
    import { loadComponent } from "./include.js";
    import { initHeaderMenu, initHeaderScrollBehavior, initScrollPopup }
        from "./GlobalFiles/HEADER_FOOTER.js";

    /* -----------------------------
       LOAD HEADER
    ------------------------------*/
    loadComponent("#header", "GlobalFiles/GlobalFiles.html", () => {
        initHeaderMenu();
        initHeaderScrollBehavior();
        initScrollPopup();

        const wait = setInterval(() => {
            const el = document.getElementById("userArea");
            if (el) {
                clearInterval(wait);
                import("./auth-state.js");
            }
        }, 30);
    });

    /* -----------------------------
       LOAD PHOTO DATA
    ------------------------------*/
    fetch("GlobalFiles/photoData.json")
        .then(res => res.json())
        .then(data => {
            const container = document.getElementById("photoContainer");

            data.forEach(photo => {
                const card = document.createElement("div");
                card.className = "photoCard";

                card.innerHTML = `
                    <div class="photoImg" style="background-image: url('${photo.url}')"></div>
                    <h3>${photo.title}</h3>
                    <p>${photo.description}</p>
                    <button class="downloadBtn" data-url="${photo.url}">Download</button>
                `;

                container.appendChild(card);
            });
        });

    /* -----------------------------
       DIRECT DOWNLOAD HANDLER
       (NO CORS REQUIRED)
    ------------------------------*/
    document.addEventListener("click", (e) => {
        if (!e.target.classList.contains("downloadBtn")) return;

        const url = e.target.dataset.url;
        console.log("Direct download:", url);

        const a = document.createElement("a");
        a.href = url;
        a.download = url.split("/").pop(); // filename
        document.body.appendChild(a);
        a.click();
        a.remove();
    });
</script>
</html>
