<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>GingerResources</title>

    <link rel="stylesheet" href="cssFiles/GingerResources.css?v=5">
    <link rel="stylesheet" href="GlobalFiles/HEADER_FOOTER.css?v=5">
    <link rel="icon" type="svg" href="https://pub-3a50bbfda00a49b2b959d58cd7bea019.r2.dev/Images/Logo/Icons/WhiteGinger.svg">
</head>

<body>
<div id="header" data-page="gingerResources"></div>

<section class="photoGallery">
    <h1>Downloadable Photos</h1>
    <div id="photoContainer" class="photoContainer"></div>
</section>

<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox hidden">
    <div class="lightbox-content">
        <span id="lightbox-close" class="lightbox-close">&times;</span>
        <img id="lightbox-img" class="lightbox-img" src="">
        <button id="lightbox-download" class="lightbox-download">Download</button>
    </div>
</div>

<script type="module">
    console.log("SCRIPT VERSION 5 LOADED");

    /* -----------------------------
       IMPORTS (CACHE-BUSTED)
    ------------------------------*/
    import { loadComponent } from "./include.js?v=5";
    import { initHeaderMenu, initHeaderScrollBehavior, initScrollPopup }
        from "./GlobalFiles/HEADER_FOOTER.js?v=5";

    import { getAuth }
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const auth = getAuth();

    /* -----------------------------
       LOAD HEADER
    ------------------------------*/
    loadComponent("#header", "GlobalFiles/GlobalFiles.html?v=5", () => {
        initHeaderMenu();
        initHeaderScrollBehavior();
        initScrollPopup();

        const wait = setInterval(() => {
            const el = document.getElementById("userArea");
            if (el) {
                clearInterval(wait);
                import("./auth-state.js?v=5");
            }
        }, 30);
    });

    /* -----------------------------
       LOAD PHOTO DATA
    ------------------------------*/
    fetch("GlobalFiles/photoData.json?v=5")
        .then(res => res.json())
        .then(data => {
            const container = document.getElementById("photoContainer");

            data.forEach(photo => {
                const card = document.createElement("div");
                card.className = "photoCard";

                card.innerHTML = `
                    <div class="photoImg"
                         style="background-image: url('${photo.full}')"
                         data-full="${photo.full}"
                         data-download="${photo.download}">
                    </div>

                    <h3>${photo.title}</h3>
                    <p>${photo.description}</p>

                    <button class="downloadBtn"
                            data-url="${photo.download}">
                        Download
                    </button>
                `;

                container.appendChild(card);
            });
        });

    /* -----------------------------
       DOWNLOAD WITH LOGIN CHECK
    ------------------------------*/
    document.addEventListener("click", (e) => {
        if (!e.target.classList.contains("downloadBtn")) return;

        const user = auth.currentUser;

        if (!user) {
            alert("You must be logged in to download photos.");
            return;
        }

        const url = e.target.dataset.url;

        const a = document.createElement("a");
        a.href = url;
        a.download = url.split("/").pop();
        document.body.appendChild(a);
        a.click();
        a.remove();
    });

    /* -----------------------------
       LIGHTBOX LOGIC
    ------------------------------*/
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-img");
    const lightboxClose = document.getElementById("lightbox-close");
    const lightboxDownload = document.getElementById("lightbox-download");

    document.addEventListener("click", (e) => {

        // Open lightbox
        if (e.target.classList.contains("photoImg")) {
            const full = e.target.dataset.full;
            const download = e.target.dataset.download;

            lightboxImg.src = full;
            lightboxDownload.dataset.url = download;

            lightbox.classList.remove("hidden");
        }

        // Close lightbox
        if (e.target === lightboxClose || e.target === lightbox) {
            lightbox.classList.add("hidden");
        }

        // Download inside lightbox
        if (e.target === lightboxDownload) {
            const user = auth.currentUser;

            if (!user) {
                alert("You must be logged in to download photos.");
                return;
            }

            const url = e.target.dataset.url;

            const a = document.createElement("a");
            a.href = url;
            a.download = url.split("/").pop();
            document.body.appendChild(a);
            a.click();
            a.remove();
        }
    });
</script>

</body>
</html>
