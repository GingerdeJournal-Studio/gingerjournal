<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GingerResources</title>

    <link rel="stylesheet" href="cssFiles/GingerResources.css">
    <link rel="stylesheet" href="GlobalFiles/HEADER_FOOTER.css">
    <link rel="icon" type="svg" href="https://pub-3a50bbfda00a49b2b959d58cd7bea019.r2.dev/Images/Logo/Icons/WhiteGinger.svg">
</head>
<body>
    <div id="header" data-page="gingerResources"></div>

    <section id="heroSection">
        <div class="heroLeft">
            <h1>GingerResources</h1>
            <p>Explore free photography presets, textures and quick guides!! Crafted for travel & street creators.</p>
            <a href="ABC_BlogPosts.html">View My Blog</a>
        </div>
        <div id="heroImage" oncontextmenu="return false;"></div>
    </section>

    <div id="categoryFilters">
        <button class="categoryBtn active" data-category="All">All</button>
        <button class="categoryBtn" data-category="Travel">Travel</button>
        <button class="categoryBtn" data-category="Food">Food</button>
        <button class="categoryBtn" data-category="People">People</button>
        <button class="categoryBtn" data-category="Nature">Nature</button>
        <button class="categoryBtn" data-category="Animals">Animals</button>
        <button class="categoryBtn" data-category="Objects">Objects</button>
        <button class="categoryBtn" data-category="Daily Life">Daily Life</button>
        <button class="categoryBtn" data-category="Events">Events</button>
    </div>

    <section class="photoGallery">
        <div id="photoContainer" class="photoContainer" oncontextmenu="return false;"></div>
    </section>

    <div id="lightbox" class="lightbox hidden" oncontextmenu="return false;">
        <div class="lightbox-content">
            <span id="lightbox-close" class="lightbox-close">&times;</span>
            <img id="lightbox-img" class="lightbox-img" src="">
            <button id="lightbox-download" class="lightbox-download">Download</button>
        </div>
    </div>

    <div class="paginationControls">
        <button id="loadMoreBtn">Load More</button>
    </div>

</body>
    <script type="module" src="jsFiles/GingerResources.js"></script>
</html>
