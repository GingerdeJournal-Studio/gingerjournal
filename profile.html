<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GingerJournal - Profile</title>

    <link rel="icon" type="svg" href="https://pub-3a50bbfda00a49b2b959d58cd7bea019.r2.dev/Images/Logo/Icons/WhiteGinger.svg">
    <link rel="stylesheet" href="GlobalFiles/HEADER_FOOTER.css">
    <link rel="stylesheet" href="cssFiles/profile.css">
    <style>header{background: #112d4e;}</style>

</head>

<body>
    <div id="header" data-page="profile"></div>

    <div class="profileSection">
        <div class="profileCard">
            <div class="accountInfoBox" id="heroImage" oncontextmenu="return false;"></div>
            <img id="profilePic" class="profilePic">
            <h2 id="profileName"></h2>
            <p id="profileEmail"></p>

            <div class="settingsSection">
                <!-- Change Name -->
                <div class="settingItem">
                    <label for="newName">Change Display Name</label>
                    <input type="text" id="newName" placeholder="Enter new name">
                    <button id="saveNameBtn">Save Name</button>
                </div>

                <!-- Change Profile Picture -->
                <div class="settingItem">
                    <label for="newPic">Change Profile Picture</label>
                    <input type="file" id="newPic" accept="image/*">
                    <button id="savePicBtn">Upload New Picture</button>
                </div>
            </div>

            <div class="btnSet">
                <button id="logoutBtn" class="logoutBtn">Logout</button>
                <button id="dashboardBtn" class="dashboardBtn" style="display: none;">Admin Dashboard</button>
            </div>
        </div>


    </div>
</body>
    <script type="module" src="jsFiles/profile.js"></script>
</html>
