<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GingerJournal Posts</title>

    <link rel="stylesheet" href="cssFiles/eachPost.css">
    <link rel="stylesheet" href="GlobalFiles/HEADER_FOOTER.css">
    <link rel="icon" type="svg" href="https://pub-3a50bbfda00a49b2b959d58cd7bea019.r2.dev/Images/Logo/Icons/WhiteGinger.svg">
    <style>header {background: #112d4e;}</style>
</head>

<body>

    <div id="header"></div>

    <main class="postContainer">
        <div id="postSlider" class="postSlider" style="display: none;">
            <div class="sliderTrack" id="sliderTrack"></div>
            <button class="sliderBtn prev" id="sliderPrev">‹</button>
            <button class="sliderBtn next" id="sliderNext">›</button>
        </div>

        <div class="content">
            <a href="BlogPosts.html" class="backBtn">← Back to Blog</a>
            <h2 id="postTitle"></h2>
            <p class="postMeta">
                <span id="postDate"></span> •
                <span id="postCategory"></span> •
                <span id="postLocation"></span>
            </p>
            <p id="postExcerpt" class="postExcerpt" style="display: none;"></p>
            <article id="postContent" class="postContent"></article>
        </div>
    </main>

    <footer id="footer"></footer>

    <script type="module" src="jsFiles/eachPost.js"></script>
</body>
    <script data-name="BMC-Widget" data-cfasync="false" src="https://cdnjs.buymeacoffee.com/1.0.0/widget.prod.min.js" data-id="GingerJournal" data-description="Support me on Buy me a coffee!" data-color="#3f72af" data-position="left" data-x_margin="18" data-y_margin="18"></script>
</html>
