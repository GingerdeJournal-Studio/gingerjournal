<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Contact</title>

    <link rel="stylesheet" href="cssFiles/FONTS.css">
    <link rel="stylesheet" href="cssFiles/Contact.css">
    <link rel="stylesheet" href="GlobalFiles/HEADER_FOOTER.css">
    <link rel="icon" type="svg" href="https://pub-3a50bbfda00a49b2b959d58cd7bea019.r2.dev/Images/Logo/Icons/WhiteGinger.svg">
</head>
<body>
    <div id="header" data-page="contact"></div>

    <section class="form">
        <form action="https://api.web3forms.com/submit" method="POST" class="formLeft">
            <h1>Get in Touch with Us!</h1>
            <hr>
            <input type="hidden" name="access_key" value="aeb13dda-3026-4730-9826-9aab118f8917">
            <input type="text" name="name" placeholder="Your Name" required class="formInput">
            <input type="email" name="email" placeholder="Your Email" required class="formInput">
            <textarea name="message" placeholder="Your message" required class="formInput"></textarea>
            <button type="submit">Submit</button>
        </form>
        <div class="formRight">
            <div class="formImage"></div>
        </div>
    </section>

    <footer id="footer"></footer>
</body>
    <script type="module">
        import { loadComponent } from "./include.js";
        import { initHeaderMenu, headerBehaviorChange, initScrollPopup } from "./GlobalFiles/HEADER_FOOTER.js";

        loadComponent("#header", "GlobalFiles/HEADER.html", () => {
            initHeaderMenu();
            headerBehaviorChange();
            initScrollPopup();

            const wait = setInterval(() => {
                const el = document.getElementById("userArea");
                if (el) {
                    clearInterval(wait);
                    import("./auth-state.js");
                }
            }, 30);
        });
        loadComponent("#footer", "GlobalFiles/FOOTER.html", () => {})
    </script>
    <script src ="GlobalFiles/HEADER_FOOTER.js"></script>
</html>
