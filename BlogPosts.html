<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>BlogPosts</title>

        <link rel="stylesheet" href="cssFiles/FONTS.css">
        <link rel="stylesheet" href="GlobalFiles/HEADER_FOOTER.css">
        <link rel="stylesheet" href="cssFiles/BlogPosts.css">
        <link rel="icon" type="svg" href="https://pub-3a50bbfda00a49b2b959d58cd7bea019.r2.dev/Images/Logo/Icons/WhiteGinger.svg">

        <!-- Google tag (gtag.js) -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-REYFLJPZQ3"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());

            gtag('config', 'G-REYFLJPZQ3');
        </script>
    </head>

    <body>

        <header id="header" data-page="blogPosts"></header>

        <div id="heroImage" oncontextmenu="return false;">
            <h1>GingerJournal Blog</h1>
            <p>Stories, travels, photography, and moments from my life.</p>
        </div>

        <nav class="filters">
            <button class="filter active" data-category="All">All</button>
            <button class="filter" data-category="China">China</button>
            <button class="filter" data-category="New York">New York</button>
            <button class="filter" data-category="Travel">Travel</button>
            <button class="filter" data-category="Daily Life">Daily Life</button>
        </nav>

        <main class="blog-grid" id="blogGrid"></main>

        <footer id="footer"></footer>

        <script type="module">
            import { loadComponent } from "./include.js";
            import {
                initHeaderMenu,
                headerBehaviorChange,
            } from "./GlobalFiles/HEADER_FOOTER.js";

            loadComponent("#header", "GlobalFiles/HEADER.html", () => {
                initHeaderMenu();
                headerBehaviorChange();
                import("./auth-state.js");
            });
            loadComponent("#footer", "GlobalFiles/FOOTER.html", () => {})
        </script>
        <script>
            document.addEventListener("scroll", () => {
                const header = document.querySelector('#heroImage');
                if(window.scrollY > 0)
                    header.classList.add('scrolled');
                else
                    header.classList.remove('scrolled');
            })
        </script>
        <script type="module" src="jsFiles/blogPosts.js"></script>
    </body>

    <script data-name="BMC-Widget" data-cfasync="false" src="https://cdnjs.buymeacoffee.com/1.0.0/widget.prod.min.js" data-id="GingerJournal" data-description="Support me on Buy me a coffee!" data-message="Welcome to our blog page! We share our fun experience from traveling here, feel free if you would like to supper us!" data-color="#3f72af" data-position="Right" data-x_margin="18" data-y_margin="18"></script>
</html>
